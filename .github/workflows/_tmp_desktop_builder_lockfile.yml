name: Temporary desktop builder lockfile generator

on:
  push:
    branches:
      - chore/electron-builder-26-hardening

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/electron-builder-26-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate exact desktop lockfile update
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact electron-builder@26.17.0

      - name: Commit generated package metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package.json desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata change produced"
            exit 0
          fi
          git commit -m "chore(desktop): upgrade electron-builder to 26.17.0 [lockfile-generated]"
          git push origin HEAD:chore/electron-builder-26-hardening

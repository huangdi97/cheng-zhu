name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # faster-whisper needs large model downloads; skip in CI.
          grep -vE '^faster-whisper' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install pytest httpx ruff

      - name: Lint — ruff
        run: ruff check .

      - name: Lint — syntax check
        run: python -m py_compile main.py api/assist/pipeline.py api/common/router.py

      - name: Full backend test suite
        run: python -m pytest -q --tb=short

      - name: Intelligence strict eval (exact route accuracy, not alias-lenient)
        run: |
          python -c "import sys, json; sys.path.insert(0, '.'); from evals.runners.route_runner import run_route_eval, run_seven_turn; r = run_route_eval(); s7 = run_seven_turn(); print(json.dumps({'exact': r['route_accuracy_exact'], 'semantic': r['route_accuracy_semantic'], 'seven_exact': s7['route_accuracy_exact'], 'unsupported_blocked': r['unsupported_claim_rate']})); assert r['route_accuracy_exact'] >= 0.9; assert s7['route_accuracy_exact'] >= 0.85; assert r['unsupported_claim_rate'] >= 0.95"
          python -m evals.r2_eval --check

      - name: v1.4 product-loop engineering evidence
        working-directory: .
        run: |
          python scripts/v14_validation_evidence.py --out-dir artifacts/validation
          python scripts/soak_sim.py --hours 3 --out artifacts/validation/v1.4-soak-3h.json

      - name: Upload v1.4 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.4-engineering-validation
          path: artifacts/validation
          retention-days: 14
          if-no-files-found: error

      - name: Release version consistency
        working-directory: .
        run: python scripts/check_release_version.py

      - name: License gate (MIT root + generated third-party notices)
        working-directory: .
        run: python scripts/generate_third_party_notices.py --check

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ── Desktop pure-JavaScript tests ───────────────────────────
  # Keep the Electron main-process helpers covered even though the desktop
  # package does not participate in the frontend build.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        # Tests only need the Electron package to be resolvable; skipping its
        # binary download keeps this job fast and avoids a flaky external fetch.
        run: npm ci --ignore-scripts

      - name: Run desktop unit tests
        run: node --test *.test.js

  # ── Playwright E2E (mocked backend, no live API needed) ──
  e2e-playwright:
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build frontend (preview server needs dist/)
        run: npm run build

      - name: Run Playwright functional tests (skip @visual)
        run: npx playwright test --config=playwright.config.mjs --grep-invert "@visual"
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ── Visual regression (pixel-diff snapshots) ─────────────
  # Baselines live under frontend/e2e/__screenshots__/ . When intentional
  # UI changes break this job, trigger the `update-visual-snapshots`
  # workflow on the feature branch to regenerate them.
  e2e-visual:
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run visual regression
        run: npx playwright test --config=playwright.config.mjs --grep "@visual"
        env:
          CI: "true"

      - name: Upload visual diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ── End-to-end smoke (real backend boot + API contracts) ─
  e2e-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          grep -vE '^faster-whisper' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run end-to-end smoke
        run: python scripts/e2e_test.py

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-logs
          path: |
            log/
            backend/data/
          retention-days: 3
          if-no-files-found: ignore

  # ── Windows packaged smoke (sidecar exe, no Python assumption) ──
  packaged-smoke:
    needs: [backend, frontend]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build backend sidecar
        run: python scripts/build_sidecar.py
      - name: Packaged smoke
        run: |
          pip install websocket-client
          python scripts/packaged_smoke.py --exe build/sidecar/chengzhu-backend/chengzhu-backend.exe --frontend-dist frontend/dist --report packaged-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-report
          path: packaged-smoke.json
          if-no-files-found: ignore

  # ── Aggregate gate so PR can require a single status check ──
  # All required jobs must succeed; nothing is skipped by path filters.
  # When this gate fails on visual diff, regenerate baselines on the
  # branch via the `update-visual-snapshots` workflow.
  ci-gate:
    needs: [backend, frontend, desktop, e2e-playwright, e2e-smoke, e2e-visual, packaged-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded or were skipped
        run: |
          ok=true
          for r in "${{ needs.backend.result }}" \
                   "${{ needs.frontend.result }}" \
                   "${{ needs.desktop.result }}" \
                   "${{ needs.e2e-playwright.result }}" \
                   "${{ needs.e2e-smoke.result }}" \
                   "${{ needs.e2e-visual.result }}" \
                   "${{ needs.packaged-smoke.result }}"; do
            case "$r" in
              success) ;;
              *) echo "Job result: $r"; ok=false ;;
            esac
          done
          $ok || { echo "One or more required jobs failed"; exit 1; }
          echo "All required jobs passed."

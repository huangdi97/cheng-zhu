name: publish-v1.4.0-on-green-main

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch v1.4.0 exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          if [ "$version" != "1.4.0" ]; then
            echo "Refusing to publish anything except v1.4.0; current version=$version"
            exit 0
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already exists; nothing to do"
            exit 0
          fi
          gh workflow run release.yml --ref main -f publish=true
          echo "Dispatched Release workflow for v$version"

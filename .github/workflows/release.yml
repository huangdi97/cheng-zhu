name: Release

# R2 Stage AI: build the Windows installer + portable zip from a clean runner
# (no Python / Node assumptions in the product), run the packaged smoke test,
# attach SHA256 + LICENSE + THIRD_PARTY_NOTICES, and publish a GitHub Release.

on:
  push:
    tags: ["v*"]
  # Build (never publish) the installer + portable on PRs that touch packaging,
  # so a release is proven reproducible before the tag.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "desktop/**"
      - "packaging/**"
      - "scripts/build_sidecar.py"
      - "scripts/runtime_fingerprint.py"
      - "backend/services/build_provenance.py"
      - "scripts/packaged_smoke.py"
      - "scripts/render_published_release_body.py"
      - "scripts/v2_conversation_stable_review_handoff.py"
      - "scripts/v2_stable_release_review_decision.py"
      - "scripts/verify_stable_release_authorization.py"
      - "scripts/verify_stable_release_source.py"
      - "scripts/verify_stable_release_source.ps1"
      - "frontend/scripts/capture-v13-packaged-window-evidence.mjs"
      - "frontend/scripts/capture-v13-packaged-web-evidence.mjs"
      - "frontend/scripts/capture-v20-conversation-packaged-evidence.mjs"
      - "backend/requirements.txt"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (false = build artifacts only)"
        required: false
        default: "false"
      source_sha:
        description: "Exact CI-proven commit SHA to build and tag. Empty = workflow event SHA."
        required: false
        default: ""
      stable_review_authorization_b64:
        description: "Stable v2+ only: base64 authorization emitted by v2_stable_release_review_decision.py. Never required for prereleases."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

# A PR that changes release engineering is rebuilt on every new commit.
# Cancel superseded PR builds so the Windows runner validates only the newest
# v1.3 head instead of burning time on obsolete packaged-app evidence.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || github.sha }}

      - name: Pin release source SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          $requested = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || github.sha }}"
          if ($requested -and $actual -ne $requested) {
            throw "checked out $actual but release source requested $requested"
          }
          "CHENGZHU_RELEASE_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release source SHA: $actual"

      - uses: actions/setup-python@v5
        with:
          python-version-file: "packaging/sidecar-python-version.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
          ruff check .
          python -m pytest -q

      - name: Release version consistency
        run: python scripts/check_release_version.py

      - name: Candidate runtime build provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist/release | Out-Null
          python scripts/runtime_fingerprint.py `
            --source-sha $env:CHENGZHU_RELEASE_SOURCE_SHA `
            --version $version `
            --out dist/release/CANDIDATE_BUILD_PROVENANCE.json
          if ($LASTEXITCODE -ne 0) { throw "candidate runtime fingerprint failed" }
          $candidate = Get-Content dist/release/CANDIDATE_BUILD_PROVENANCE.json -Raw | ConvertFrom-Json
          $runtimeSha = [string]$candidate.runtime_fingerprint.sha256
          if ($runtimeSha -notmatch '^[0-9a-f]{64}$') { throw "candidate runtime fingerprint SHA256 invalid" }
          "CHENGZHU_RUNTIME_FINGERPRINT_SHA256=$runtimeSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "candidate runtime fingerprint: $runtimeSha"
      - name: Stable green-main source wrapper regression
        env:
          GH_TOKEN: regression-token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureSha = 'a' * 40
          function global:gh {
            $joined = $args -join ' '
            if ($joined -match 'git/ref/heads/main') {
              return $fixtureSha
            }
            if ($joined -match 'actions/workflows/ci.yml/runs') {
              return (@{
                workflow_runs = @(@{
                  head_sha = $fixtureSha
                  head_branch = 'main'
                  event = 'push'
                  conclusion = 'success'
                })
              } | ConvertTo-Json -Depth 4)
            }
            throw "unexpected gh regression invocation: $joined"
          }
          try {
            & scripts/verify_stable_release_source.ps1 `
              -Version '2.0.0' `
              -SourceSha $fixtureSha
          } finally {
            Remove-Item function:global:gh -ErrorAction SilentlyContinue
          }
      - name: Stable v2+ exact green-main source gate
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          & scripts/verify_stable_release_source.ps1 `
            -Version $version `
            -SourceSha $env:CHENGZHU_RELEASE_SOURCE_SHA

      - name: License gate
        run: python scripts/generate_third_party_notices.py --check

      - name: Frontend build + unit tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b --noEmit
          npm test
          npm run build

      - name: Desktop unit tests
        working-directory: desktop
        run: |
          npm ci
          node --test *.test.js

      - name: Stable v2+ replay pilot Python environment constraints
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          STABLE_REVIEW_AUTHORIZATION_B64: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stable_review_authorization_b64 || '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if (-not $version.Contains('-') -and [int]($version.Split('.')[0]) -ge 2) {
            New-Item -ItemType Directory -Force dist/release | Out-Null
            $constraints = Join-Path $PWD "dist/release/STABLE_PYTHON_CONSTRAINTS.txt"
            python scripts/stable_python_environment_replay.py `
              --authorization-b64 "$env:STABLE_REVIEW_AUTHORIZATION_B64" `
              --source-sha $env:CHENGZHU_RELEASE_SOURCE_SHA `
              --version $version `
              --runtime-fingerprint-sha256 $env:CHENGZHU_RUNTIME_FINGERPRINT_SHA256 `
              --python-version-file packaging/sidecar-python-version.txt `
              --constraints-out $constraints `
              --out dist/release/STABLE_PYTHON_ENVIRONMENT_REPLAY.json
            if ($LASTEXITCODE -ne 0) { throw "Stable Python environment replay preparation failed" }
            $replay = Get-Content dist/release/STABLE_PYTHON_ENVIRONMENT_REPLAY.json -Raw | ConvertFrom-Json
            $expectedEnvSha = [string]$replay.pilot_python_environment_sha256
            if ($expectedEnvSha -notmatch '^[0-9a-f]{64}$') {
              throw "Stable Python replay metadata contains invalid environment SHA256"
            }
            "PIP_CONSTRAINT=$constraints" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CHENGZHU_EXPECTED_PYTHON_ENVIRONMENT_SHA256=$expectedEnvSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Stable sidecar build will replay and pre-verify the pilot Python environment."
          } else {
            Write-Host "Python environment replay is not required for prerelease / legacy Stable channels."
          }

      - name: Build backend sidecar (clean venv, PyInstaller)
        run: python scripts/build_sidecar.py --clean

      - name: Verify embedded build provenance matches candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Content dist/release/CANDIDATE_BUILD_PROVENANCE.json -Raw | ConvertFrom-Json
          $built = Get-Content build/provenance/build-provenance.json -Raw | ConvertFrom-Json
          foreach ($field in @('contract_version','app_version','source_sha','release_channel')) {
            if ([string]$candidate.$field -ne [string]$built.$field) { throw "embedded build provenance drift: $field" }
          }
          if ([string]$candidate.runtime_fingerprint.contract_version -ne [string]$built.runtime_fingerprint.contract_version) { throw "embedded runtime fingerprint contract drift" }
          if ([string]$candidate.runtime_fingerprint.sha256 -ne [string]$built.runtime_fingerprint.sha256) { throw "embedded runtime fingerprint SHA drift" }
          if ([string]$built.runtime_fingerprint.sha256 -ne $env:CHENGZHU_RUNTIME_FINGERPRINT_SHA256) { throw "embedded runtime fingerprint differs from release gate runtime SHA" }
          $pythonEnvSha = [string]$built.python_environment.sha256
          if ($pythonEnvSha -notmatch '^[0-9a-f]{64}$') { throw "embedded Python environment SHA256 invalid" }
          "CHENGZHU_PYTHON_ENVIRONMENT_SHA256=$pythonEnvSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Copy-Item build/provenance/build-provenance.json dist/release/BUILD_PROVENANCE.json -Force
      - name: Stable v2+ human release authorization gate
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          STABLE_REVIEW_AUTHORIZATION_B64: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stable_review_authorization_b64 || '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist/release | Out-Null
          python scripts/verify_stable_release_authorization.py `
            --version $version `
            --source-sha $env:CHENGZHU_RELEASE_SOURCE_SHA `
            --runtime-fingerprint-sha256 $env:CHENGZHU_RUNTIME_FINGERPRINT_SHA256 `
            --python-environment-sha256 $env:CHENGZHU_PYTHON_ENVIRONMENT_SHA256 `
            --authorization-b64 "$env:STABLE_REVIEW_AUTHORIZATION_B64" `
            --out dist/release/RELEASE_AUTHORIZATION.json
          if ($LASTEXITCODE -ne 0) { throw "Stable release authorization gate failed" }
          $authorization = Get-Content dist/release/RELEASE_AUTHORIZATION.json -Raw | ConvertFrom-Json
          if (-not $version.Contains('-') -and [int]($version.Split('.')[0]) -ge 2) {
            if ($authorization.status -ne 'VERIFIED_HUMAN_STABLE_RELEASE_REVIEW_GO') {
              throw "Stable v2+ requires VERIFIED_HUMAN_STABLE_RELEASE_REVIEW_GO"
            }
          }

      - name: Packaged smoke (sidecar, fake provider, restart, persistence)
        run: |
          pip install websocket-client
          python scripts/packaged_smoke.py --exe build/sidecar/chengzhu-backend/chengzhu-backend.exe --frontend-dist frontend/dist --report dist/release/packaged-smoke.json

      - name: Package Electron (installer + portable)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Install Playwright Chromium for hosted-runner evidence fallback
        working-directory: frontend
        run: npx playwright install chromium

      - name: Capture packaged runtime UI evidence
        working-directory: frontend
        shell: pwsh
        run: |
          node scripts/capture-v13-packaged-window-evidence.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Hosted Windows runner could not reach Electron BrowserWindow evidence mode; falling back to packaged sidecar + packaged frontend-dist in headless Chromium. The manifest records this limitation explicitly."
            node scripts/capture-v13-packaged-web-evidence.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate Conversation Beta packaged UI evidence contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $manifestPath = "artifacts/release-evidence/v$version/manifest.json"
          if (-not (Test-Path $manifestPath)) { throw "missing packaged UI evidence manifest: $manifestPath" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.conversation_beta) { throw "packaged UI evidence missing conversation_beta block" }
          foreach ($field in @('space_id','prior_session_id','live_session_id')) {
            if (-not $manifest.conversation_beta.$field) { throw "conversation_beta missing $field" }
          }
          if ($manifest.conversation_beta.evidence_boundary -ne 'PACKAGED_BETA_ENGINEERING_EVIDENCE_NOT_REAL_USER_VALIDATION') {
            throw "Conversation Beta evidence boundary drifted"
          }
          $entries = @($manifest.entries)
          $conversationEntries = @($entries | Where-Object { $_.name -match 'conversation' })
          if ($conversationEntries.Count -lt 9) {
            throw "expected >= 9 Conversation packaged UI captures, got $($conversationEntries.Count)"
          }
          Write-Host "Conversation Beta packaged UI evidence OK: $($conversationEntries.Count) captures"

      - name: Capture independent Conversation packaged evidence
        working-directory: frontend
        run: node scripts/capture-v20-conversation-packaged-evidence.mjs

      - name: Upload failed Conversation visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chengzhu-conversation-blocked-visual
          path: artifacts/release-evidence/v*/conversation-beta/*-BLOCKED.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload packaged runtime UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: chengzhu-runtime-ui-evidence
          path: artifacts/release-evidence
          retention-days: 30
          if-no-files-found: error

      - name: Clean installer replay on fresh Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "dist/desktop/Chengzhu-Setup-x64.exe").Path
          New-Item -ItemType Directory -Force dist/release | Out-Null

          # NSIS occasionally exits with 0xC0000005 on hosted Windows runners
          # before writing the target directory (Defender/runner timing). Do
          # not weaken the gate: retry into a fresh directory, then still
          # require the installed resources and packaged smoke to pass.
          $attempts = @()
          $installDir = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Get-Process Chengzhu, chengzhu-backend -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ([Math]::Min(2 * $attempt, 5))

            $candidate = Join-Path $env:RUNNER_TEMP "Chengzhu-CleanInstall-$attempt"
            if (Test-Path $candidate) { Remove-Item -Recurse -Force $candidate -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force $candidate | Out-Null

            $started = Get-Date
            $proc = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$candidate") -Wait -PassThru
            $attempts += [pscustomobject]@{
              attempt = $attempt
              install_dir = $candidate
              exit_code = $proc.ExitCode
              duration_ms = [int]((Get-Date) - $started).TotalMilliseconds
            }

            if ($proc.ExitCode -eq 0) {
              $installDir = $candidate
              break
            }

            Write-Warning "NSIS attempt $attempt failed with exit code $($proc.ExitCode); retrying with a fresh target."
          }

          $attempts | ConvertTo-Json -Depth 4 | Set-Content dist/release/nsis-clean-install-attempts.json -Encoding utf8
          if (-not $installDir) {
            Get-Content dist/release/nsis-clean-install-attempts.json
            throw "NSIS clean install failed after 3 isolated attempts"
          }

          $appExe = Join-Path $installDir "Chengzhu.exe"
          $resources = Join-Path $installDir "resources"
          $backendExe = Join-Path $resources "backend/chengzhu-backend.exe"
          $frontendDist = Join-Path $resources "frontend-dist"
          foreach ($required in @($appExe, $backendExe, $frontendDist)) {
            if (-not (Test-Path $required)) { throw "clean install missing: $required" }
          }

          python scripts/packaged_smoke.py --exe $backendExe --frontend-dist $frontendDist --resources $resources --report dist/release/clean-install-smoke.json

          $smoke = Get-Content dist/release/clean-install-smoke.json -Raw | ConvertFrom-Json
          if (-not $smoke.passed) { throw "clean-install packaged smoke did not pass" }

          @{
            installer = $installer
            install_dir = $installDir
            app_exe = $appExe
            backend_exe = $backendExe
            frontend_dist = $frontendDist
            app_version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
            smoke_passed = $smoke.passed
          } | ConvertTo-Json -Depth 4 | Set-Content dist/release/clean-install-replay.json -Encoding utf8

      - name: Installed-layout smoke (unpacked app resources)
        run: python scripts/packaged_smoke.py --exe dist/desktop/win-unpacked/resources/backend/chengzhu-backend.exe --frontend-dist dist/desktop/win-unpacked/resources/frontend-dist --resources dist/desktop/win-unpacked/resources --report dist/release/installed-layout-smoke.json

      - name: Collect release files + SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/desktop/Chengzhu-Setup-x64.exe dist/release/
          Copy-Item dist/desktop/Chengzhu-Portable-x64.zip dist/release/
          Copy-Item LICENSE dist/release/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist/release/
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          Copy-Item "docs/RELEASE_NOTES_v$version.md" dist/release/
          $hashFiles = @('Chengzhu-Setup-x64.exe','Chengzhu-Portable-x64.zip','BUILD_PROVENANCE.json')
          if (Test-Path "dist/release/RELEASE_AUTHORIZATION.json") {
            $hashFiles += 'RELEASE_AUTHORIZATION.json'
          }
          $lines = foreach ($f in $hashFiles) {
            $h = (Get-FileHash "dist/release/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works on Linux / macOS too
          [IO.File]::WriteAllText("$PWD/dist/release/SHA256SUMS.txt", (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          Get-Content dist/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chengzhu-windows-release
          path: dist/release
          retention-days: 30
          if-no-files-found: error

      - name: Create draft GitHub Release for verification
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$version" }
          if ($tag -ne "v$version") { throw "tag $tag does not match app version $version" }
          # A previous failed verification may have left a draft. Replace only
          # drafts; never overwrite an already-published release.
          gh release view $tag --json isDraft --jq '.isDraft' *> $null
          if ($LASTEXITCODE -eq 0) {
            $isDraft = gh release view $tag --json isDraft --jq '.isDraft'
            if ($isDraft -ne 'true') { throw "release $tag is already published; refusing to replace it" }
            gh release delete $tag --yes --cleanup-tag
          }
          $sourceSha = $env:CHENGZHU_RELEASE_SOURCE_SHA
          if (-not $sourceSha) { throw "CHENGZHU_RELEASE_SOURCE_SHA is empty" }
          $isPrerelease = $version.Contains('-')
          if (-not (Test-Path "dist/release/RELEASE_AUTHORIZATION.json")) {
            throw "missing release authorization audit asset"
          }
          if ($isPrerelease) {
            gh release create $tag `
              dist/release/Chengzhu-Setup-x64.exe `
              dist/release/Chengzhu-Portable-x64.zip `
              dist/release/SHA256SUMS.txt `
              dist/release/LICENSE.txt `
              dist/release/THIRD_PARTY_NOTICES.md `
              "dist/release/RELEASE_NOTES_v$version.md" `
              dist/release/BUILD_PROVENANCE.json `
              dist/release/RELEASE_AUTHORIZATION.json `
              --target $sourceSha `
              --draft `
              --prerelease `
              --latest=false `
              --title "成竹 Chengzhu $tag" `
              --notes-file "dist/release/RELEASE_NOTES_v$version.md"
          } else {
            gh release create $tag `
              dist/release/Chengzhu-Setup-x64.exe `
              dist/release/Chengzhu-Portable-x64.zip `
              dist/release/SHA256SUMS.txt `
              dist/release/LICENSE.txt `
              dist/release/THIRD_PARTY_NOTICES.md `
              "dist/release/RELEASE_NOTES_v$version.md" `
              dist/release/BUILD_PROVENANCE.json `
              dist/release/RELEASE_AUTHORIZATION.json `
              --target $sourceSha `
              --draft `
              --title "成竹 Chengzhu $tag" `
              --notes-file "dist/release/RELEASE_NOTES_v$version.md"
          }

          # Important GitHub behavior: a draft Release does not create the
          # refs/tags/<tag> git ref yet. Therefore validating the git ref here
          # will always 404. Validate the draft's target commit instead; the
          # actual tag ref is created only when the verified draft is published
          # and is checked immediately after publish below.
          $draftTarget = (gh release view $tag --json targetCommitish --jq '.targetCommitish').Trim()
          if ($draftTarget -ne $sourceSha) {
            throw "draft release $tag targets $draftTarget but binaries were built from $sourceSha"
          }
          Write-Host "draft release target/source invariant: $tag -> $draftTarget"

      - name: Download-back verification from verified draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$version" }
          $sourceSha = $env:CHENGZHU_RELEASE_SOURCE_SHA
          # The Release is still a draft at this stage, so there is no git tag
          # ref yet. Verify the authenticated draft Release points at the exact
          # CI-proven source SHA, then download the assets from that draft.
          $draftTarget = (gh release view $tag --json targetCommitish,isDraft --jq 'select(.isDraft == true) | .targetCommitish').Trim()
          if (-not $draftTarget) {
            throw "download-back refused: $tag is not the expected draft release"
          }
          if ($draftTarget -ne $sourceSha) {
            throw "download-back refused: draft $tag targets $draftTarget but release build source is $sourceSha"
          }
          $download = Join-Path $env:RUNNER_TEMP "chengzhu-download-back-$version"
          if (Test-Path $download) { Remove-Item -Recurse -Force $download }
          New-Item -ItemType Directory -Force $download | Out-Null

          $downloaded = $false
          for ($i = 1; $i -le 5; $i++) {
            try {
              gh release download $tag --dir $download --clobber --pattern "Chengzhu-Setup-x64.exe" --pattern "Chengzhu-Portable-x64.zip" --pattern "SHA256SUMS.txt" --pattern "BUILD_PROVENANCE.json" --pattern "RELEASE_AUTHORIZATION.json"
              $downloaded = $true
              break
            } catch {
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds (3 * $i)
            }
          }
          if (-not $downloaded) { throw "release assets were not downloadable" }

          $sums = Get-Content (Join-Path $download "SHA256SUMS.txt")
          foreach ($line in $sums) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') { continue }
            $expected = $Matches[1].ToLower()
            $name = $Matches[2].Trim()
            $file = Join-Path $download $name
            if (-not (Test-Path $file)) { throw "download-back missing asset: $name" }
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "SHA256 mismatch for $name" }
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Chengzhu-DownloadBackInstall"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          New-Item -ItemType Directory -Force $installDir | Out-Null
          $installer = Join-Path $download "Chengzhu-Setup-x64.exe"
          $proc = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "download-back installer failed: $($proc.ExitCode)" }

          $resources = Join-Path $installDir "resources"
          $backendExe = Join-Path $resources "backend/chengzhu-backend.exe"
          $frontendDist = Join-Path $resources "frontend-dist"
          foreach ($required in @((Join-Path $installDir "Chengzhu.exe"), $backendExe, $frontendDist)) {
            if (-not (Test-Path $required)) { throw "download-back install missing: $required" }
          }

          python scripts/packaged_smoke.py --exe $backendExe --frontend-dist $frontendDist --resources $resources --report dist/release/download-back-smoke.json
          $smoke = Get-Content dist/release/download-back-smoke.json -Raw | ConvertFrom-Json
          if (-not $smoke.passed) { throw "download-back packaged smoke did not pass" }

          @{
            tag = $tag
            source = "verified draft GitHub Release download"
            source_sha = $sourceSha
            draft_target_sha = $draftTarget
            tag_sha = $null
            installer_sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
            portable_sha256 = (Get-FileHash (Join-Path $download "Chengzhu-Portable-x64.zip") -Algorithm SHA256).Hash.ToLower()
            smoke_passed = $smoke.passed
          } | ConvertTo-Json -Depth 4 | Set-Content dist/release/download-back-verification.json -Encoding utf8

      - name: Publish verified GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$version" }
          $sourceSha = $env:CHENGZHU_RELEASE_SOURCE_SHA
          $draftTarget = (gh release view $tag --json targetCommitish,isDraft --jq 'select(.isDraft == true) | .targetCommitish').Trim()
          if (-not $draftTarget) {
            throw "refusing to publish: $tag is not the expected verified draft"
          }
          if ($draftTarget -ne $sourceSha) {
            throw "refusing to publish: draft $tag targets $draftTarget but binaries were built from $sourceSha"
          }

          # Re-check immediately before publication. A Stable candidate that
          # was current/green when the job started becomes stale if main moves
          # during the long Windows build and download-back verification.
          & scripts/verify_stable_release_source.ps1 `
            -Version $version `
            -SourceSha $sourceSha

          $isPrerelease = $version.Contains('-')
          if (-not $isPrerelease -and [int]($version.Split('.')[0]) -ge 2) {
            $authorizationPath = "dist/release/RELEASE_AUTHORIZATION.json"
            if (-not (Test-Path $authorizationPath)) {
              throw "Stable v2+ publish refused: RELEASE_AUTHORIZATION.json is missing"
            }
            $authorization = Get-Content $authorizationPath -Raw | ConvertFrom-Json
            if ($authorization.status -ne "VERIFIED_HUMAN_STABLE_RELEASE_REVIEW_GO") {
              throw "Stable v2+ publish refused: human Stable release review is not GO"
            }
            if ($authorization.version -ne $version -or $authorization.source_sha -ne $sourceSha) {
              throw "Stable v2+ publish refused: authorization candidate drift"
            }
            if ([string]$authorization.runtime_fingerprint_sha256 -ne $env:CHENGZHU_RUNTIME_FINGERPRINT_SHA256) {
              throw "Stable v2+ publish refused: authorization runtime fingerprint drift"
            }
            $publicBuild = Get-Content dist/release/BUILD_PROVENANCE.json -Raw | ConvertFrom-Json
            if ([string]$publicBuild.runtime_fingerprint.sha256 -ne $env:CHENGZHU_RUNTIME_FINGERPRINT_SHA256) {
              throw "Stable v2+ publish refused: public build provenance runtime fingerprint drift"
            }
            if ([string]$authorization.python_environment_sha256 -ne $env:CHENGZHU_PYTHON_ENVIRONMENT_SHA256) {
              throw "Stable v2+ publish refused: authorization Python environment drift"
            }
            if ([string]$publicBuild.python_environment.sha256 -ne $env:CHENGZHU_PYTHON_ENVIRONMENT_SHA256) {
              throw "Stable v2+ publish refused: public build Python environment drift"
            }
          }

          # Render authoritative publication metadata before the draft becomes
          # public. The uploaded RELEASE_NOTES asset stays byte-for-byte
          # unchanged; only the GitHub Release display body gets a generated
          # status block. Doing this pre-publication also works with repositories
          # that enable immutable Releases after publish.
          $releaseChannel = $(if ($isPrerelease) { "PRERELEASE" } else { "STABLE" })
          $publishedBody = "dist/release/published-release-body.md"
          $renderArgs = @(
            "scripts/render_published_release_body.py",
            "--input", "dist/release/RELEASE_NOTES_v$version.md",
            "--output", $publishedBody,
            "--tag", $tag,
            "--source-sha", $sourceSha,
            "--channel", $releaseChannel
          )
          if ($isPrerelease) {
            $latestStableBeforePublish = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
            if ($latestStableBeforePublish -eq $tag) {
              throw "prerelease draft $tag unexpectedly equals Stable Latest before publish"
            }
            $renderArgs += @("--stable-latest", $latestStableBeforePublish)
          }
          python @renderArgs
          if ($LASTEXITCODE -ne 0) { throw "failed to render published Release body" }

          # Publishing the draft is the operation that materializes the git tag.
          # SemVer prereleases are public Beta artifacts, never the stable Latest.
          if ($isPrerelease) {
            gh release edit $tag --notes-file $publishedBody --draft=false --prerelease --latest=false --target $sourceSha
          } else {
            gh release edit $tag --notes-file $publishedBody --draft=false --latest --target $sourceSha
          }
          $releaseState = gh release view $tag --json isDraft,isPrerelease,body --jq '{isDraft: .isDraft, isPrerelease: .isPrerelease, body: .body}' | ConvertFrom-Json
          if ($releaseState.isDraft) { throw "verified release $tag did not publish" }
          if ([bool]$releaseState.isPrerelease -ne $isPrerelease) {
            throw "release channel mismatch for ${tag}: expected prerelease=$isPrerelease"
          }
          if (
            -not [string]$releaseState.body -or
            -not ([string]$releaseState.body).Contains("CHENGZHU_PUBLISHED_STATUS_BEGIN") -or
            -not ([string]$releaseState.body).Contains($sourceSha) -or
            -not ([string]$releaseState.body).Contains("Channel: **$releaseChannel**")
          ) {
            throw "published Release body is missing authoritative publication truth"
          }
          if ($isPrerelease) {
            $latestStable = (gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name').Trim()
            if ($latestStable -eq $tag) {
              throw "prerelease $tag incorrectly replaced the stable Latest release"
            }
            Write-Host "prerelease channel invariant: $tag is prerelease; stable Latest remains $latestStable"
          }

          $tagSha = (gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $sourceSha) {
            throw "published release provenance failure: tag $tag points to $tagSha but binaries were built from $sourceSha"
          }

          # Rewrite the downloadable verification artifact with the now-real
          # public tag SHA so downstream provenance can be audited directly.
          $verificationPath = "dist/release/download-back-verification.json"
          if (Test-Path $verificationPath) {
            & scripts/enrich_release_verification.ps1 `
              -Path $verificationPath `
              -TagSha $tagSha `
              -ReleaseChannel $releaseChannel `
              -IsPrerelease $isPrerelease
          }
          Write-Host "published release tag/source invariant: $tag -> $tagSha"


      - name: Published Release body regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP "chengzhu-release-body-fixture.md"
          $rendered = Join-Path $env:RUNNER_TEMP "chengzhu-release-body-rendered.md"
          @(
            "# Candidate notes",
            "",
            "This candidate is pre-publication wording."
          ) | Set-Content $fixture -Encoding utf8

          $renderArgs = @(
            "scripts/render_published_release_body.py",
            "--input", $fixture,
            "--output", $rendered,
            "--tag", "v0.0.0-test",
            "--source-sha", "0123456789abcdef0123456789abcdef01234567",
            "--channel", "PRERELEASE",
            "--stable-latest", "v0.0.0"
          )
          python @renderArgs
          if ($LASTEXITCODE -ne 0) { throw "published body renderer regression failed" }
          $body = Get-Content $rendered -Raw
          if (-not $body.Contains("CHENGZHU_PUBLISHED_STATUS_BEGIN")) { throw "published body marker missing" }
          if (-not $body.Contains("Channel: **PRERELEASE**")) { throw "published body channel missing" }
          if (-not $body.Contains("0123456789abcdef0123456789abcdef01234567")) { throw "published body source SHA missing" }
          if (-not $body.Contains("This candidate is pre-publication wording.")) { throw "underlying notes were not preserved" }

      - name: Release verification metadata regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP "chengzhu-release-verification-fixture.json"
          @{
            tag = "v0.0.0-test"
            source_sha = "0123456789abcdef"
            tag_sha = $null
            smoke_passed = $true
          } | ConvertTo-Json -Depth 4 | Set-Content $fixture -Encoding utf8

          & scripts/enrich_release_verification.ps1 `
            -Path $fixture `
            -TagSha "fedcba9876543210" `
            -ReleaseChannel "PRERELEASE" `
            -IsPrerelease $true

          $roundTrip = Get-Content $fixture -Raw | ConvertFrom-Json
          if ($roundTrip.tag_sha -ne "fedcba9876543210") { throw "tag_sha enrichment regression" }
          if ($roundTrip.release_channel -ne "PRERELEASE") { throw "release_channel enrichment regression" }
          if (-not [bool]$roundTrip.is_prerelease) { throw "is_prerelease enrichment regression" }

      - name: Upload download-back verification
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chengzhu-download-back-verification
          path: |
            dist/release/download-back-smoke.json
            dist/release/download-back-verification.json
          retention-days: 30
          if-no-files-found: error

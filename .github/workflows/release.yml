name: Release

# R2 Stage AI: build the Windows installer + portable zip from a clean runner
# (no Python / Node assumptions in the product), run the packaged smoke test,
# attach SHA256 + LICENSE + THIRD_PARTY_NOTICES, and publish a GitHub Release.

on:
  push:
    tags: ["v*"]
  # Build (never publish) the installer + portable on PRs that touch packaging,
  # so a release is proven reproducible before the tag.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "desktop/**"
      - "packaging/**"
      - "scripts/build_sidecar.py"
      - "scripts/packaged_smoke.py"
      - "frontend/scripts/capture-v13-packaged-window-evidence.mjs"
      - "frontend/scripts/capture-v13-packaged-web-evidence.mjs"
      - "backend/requirements.txt"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (false = build artifacts only)"
        required: false
        default: "false"
      source_sha:
        description: "Exact CI-proven commit SHA to build and tag. Empty = workflow event SHA."
        required: false
        default: ""

permissions:
  contents: write

# A PR that changes release engineering is rebuilt on every new commit.
# Cancel superseded PR builds so the Windows runner validates only the newest
# v1.3 head instead of burning time on obsolete packaged-app evidence.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch itself runs from a branch ref, but automated
          # publishing passes the exact CI-proven SHA here. This prevents main
          # advancing while a release is being built from changing the source.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || github.sha }}

      - name: Pin release source SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          $requested = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || github.sha }}"
          if ($requested -and $actual -ne $requested) {
            throw "checked out $actual but release source requested $requested"
          }
          "CHENGZHU_RELEASE_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release source SHA: $actual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
          ruff check .
          python -m pytest -q

      - name: Release version consistency
        run: python scripts/check_release_version.py

      - name: License gate
        run: python scripts/generate_third_party_notices.py --check

      - name: Frontend build + unit tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b --noEmit
          npm test
          npm run build

      - name: Desktop unit tests
        working-directory: desktop
        run: |
          npm ci
          node --test *.test.js

      - name: Build backend sidecar (clean venv, PyInstaller)
        run: python scripts/build_sidecar.py

      - name: Packaged smoke (sidecar, fake provider, restart, persistence)
        run: |
          pip install websocket-client
          python scripts/packaged_smoke.py --exe build/sidecar/chengzhu-backend/chengzhu-backend.exe --frontend-dist frontend/dist --report dist/release/packaged-smoke.json

      - name: Package Electron (installer + portable)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Install Playwright Chromium for hosted-runner evidence fallback
        working-directory: frontend
        run: npx playwright install chromium

      - name: Capture packaged runtime UI evidence
        working-directory: frontend
        shell: pwsh
        run: |
          node scripts/capture-v13-packaged-window-evidence.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Hosted Windows runner could not reach Electron BrowserWindow evidence mode; falling back to packaged sidecar + packaged frontend-dist in headless Chromium. The manifest records this limitation explicitly."
            node scripts/capture-v13-packaged-web-evidence.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload packaged runtime UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: chengzhu-runtime-ui-evidence
          path: artifacts/release-evidence
          retention-days: 30
          if-no-files-found: error

      - name: Clean installer replay on fresh Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "dist/desktop/Chengzhu-Setup-x64.exe").Path
          New-Item -ItemType Directory -Force dist/release | Out-Null

          # NSIS occasionally exits with 0xC0000005 on hosted Windows runners
          # before writing the target directory (Defender/runner timing). Do
          # not weaken the gate: retry into a fresh directory, then still
          # require the installed resources and packaged smoke to pass.
          $attempts = @()
          $installDir = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Get-Process Chengzhu, chengzhu-backend -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ([Math]::Min(2 * $attempt, 5))

            $candidate = Join-Path $env:RUNNER_TEMP "Chengzhu-CleanInstall-$attempt"
            if (Test-Path $candidate) { Remove-Item -Recurse -Force $candidate -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force $candidate | Out-Null

            $started = Get-Date
            $proc = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$candidate") -Wait -PassThru
            $attempts += [pscustomobject]@{
              attempt = $attempt
              install_dir = $candidate
              exit_code = $proc.ExitCode
              duration_ms = [int]((Get-Date) - $started).TotalMilliseconds
            }

            if ($proc.ExitCode -eq 0) {
              $installDir = $candidate
              break
            }

            Write-Warning "NSIS attempt $attempt failed with exit code $($proc.ExitCode); retrying with a fresh target."
          }

          $attempts | ConvertTo-Json -Depth 4 | Set-Content dist/release/nsis-clean-install-attempts.json -Encoding utf8
          if (-not $installDir) {
            Get-Content dist/release/nsis-clean-install-attempts.json
            throw "NSIS clean install failed after 3 isolated attempts"
          }

          $appExe = Join-Path $installDir "Chengzhu.exe"
          $resources = Join-Path $installDir "resources"
          $backendExe = Join-Path $resources "backend/chengzhu-backend.exe"
          $frontendDist = Join-Path $resources "frontend-dist"
          foreach ($required in @($appExe, $backendExe, $frontendDist)) {
            if (-not (Test-Path $required)) { throw "clean install missing: $required" }
          }

          python scripts/packaged_smoke.py --exe $backendExe --frontend-dist $frontendDist --resources $resources --report dist/release/clean-install-smoke.json

          $smoke = Get-Content dist/release/clean-install-smoke.json -Raw | ConvertFrom-Json
          if (-not $smoke.passed) { throw "clean-install packaged smoke did not pass" }

          @{
            installer = $installer
            install_dir = $installDir
            app_exe = $appExe
            backend_exe = $backendExe
            frontend_dist = $frontendDist
            app_version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
            smoke_passed = $smoke.passed
          } | ConvertTo-Json -Depth 4 | Set-Content dist/release/clean-install-replay.json -Encoding utf8

      - name: Installed-layout smoke (unpacked app resources)
        run: python scripts/packaged_smoke.py --exe dist/desktop/win-unpacked/resources/backend/chengzhu-backend.exe --frontend-dist dist/desktop/win-unpacked/resources/frontend-dist --resources dist/desktop/win-unpacked/resources --report dist/release/installed-layout-smoke.json

      - name: Collect release files + SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/desktop/Chengzhu-Setup-x64.exe dist/release/
          Copy-Item dist/desktop/Chengzhu-Portable-x64.zip dist/release/
          Copy-Item LICENSE dist/release/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist/release/
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          Copy-Item "docs/RELEASE_NOTES_v$version.md" dist/release/
          $lines = foreach ($f in @('Chengzhu-Setup-x64.exe','Chengzhu-Portable-x64.zip')) {
            $h = (Get-FileHash "dist/release/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works on Linux / macOS too
          [IO.File]::WriteAllText("$PWD/dist/release/SHA256SUMS.txt", (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          Get-Content dist/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chengzhu-windows-release
          path: dist/release
          retention-days: 30
          if-no-files-found: error

      - name: Create draft GitHub Release for verification
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$version" }
          if ($tag -ne "v$version") { throw "tag $tag does not match app version $version" }
          # A previous failed verification may have left a draft. Replace only
          # drafts; never overwrite an already-published release.
          gh release view $tag --json isDraft --jq '.isDraft' *> $null
          if ($LASTEXITCODE -eq 0) {
            $isDraft = gh release view $tag --json isDraft --jq '.isDraft'
            if ($isDraft -ne 'true') { throw "release $tag is already published; refusing to replace it" }
            gh release delete $tag --yes --cleanup-tag
          }
          $sourceSha = $env:CHENGZHU_RELEASE_SOURCE_SHA
          if (-not $sourceSha) { throw "CHENGZHU_RELEASE_SOURCE_SHA is empty" }
          gh release create $tag `
            dist/release/Chengzhu-Setup-x64.exe `
            dist/release/Chengzhu-Portable-x64.zip `
            dist/release/SHA256SUMS.txt `
            dist/release/LICENSE.txt `
            dist/release/THIRD_PARTY_NOTICES.md `
            "dist/release/RELEASE_NOTES_v$version.md" `
            --target $sourceSha `
            --draft `
            --title "成竹 Chengzhu $tag" `
            --notes-file "dist/release/RELEASE_NOTES_v$version.md"
          $tagSha = (gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $sourceSha) {
            throw "release tag $tag points to $tagSha but binaries were built from $sourceSha"
          }
          Write-Host "release tag/source invariant: $tag -> $tagSha"

      - name: Download-back verification from published GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$version" }
          $sourceSha = $env:CHENGZHU_RELEASE_SOURCE_SHA
          $tagSha = (gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $sourceSha) {
            throw "download-back refused: tag $tag points to $tagSha but release build source is $sourceSha"
          }
          $download = Join-Path $env:RUNNER_TEMP "chengzhu-download-back-$version"
          if (Test-Path $download) { Remove-Item -Recurse -Force $download }
          New-Item -ItemType Directory -Force $download | Out-Null

          $downloaded = $false
          for ($i = 1; $i -le 5; $i++) {
            try {
              gh release download $tag --dir $download --clobber --pattern "Chengzhu-Setup-x64.exe" --pattern "Chengzhu-Portable-x64.zip" --pattern "SHA256SUMS.txt"
              $downloaded = $true
              break
            } catch {
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds (3 * $i)
            }
          }
          if (-not $downloaded) { throw "release assets were not downloadable" }

          $sums = Get-Content (Join-Path $download "SHA256SUMS.txt")
          foreach ($line in $sums) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') { continue }
            $expected = $Matches[1].ToLower()
            $name = $Matches[2].Trim()
            $file = Join-Path $download $name
            if (-not (Test-Path $file)) { throw "download-back missing asset: $name" }
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "SHA256 mismatch for $name" }
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Chengzhu-DownloadBackInstall"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          New-Item -ItemType Directory -Force $installDir | Out-Null
          $installer = Join-Path $download "Chengzhu-Setup-x64.exe"
          $proc = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "download-back installer failed: $($proc.ExitCode)" }

          $resources = Join-Path $installDir "resources"
          $backendExe = Join-Path $resources "backend/chengzhu-backend.exe"
          $frontendDist = Join-Path $resources "frontend-dist"
          foreach ($required in @((Join-Path $installDir "Chengzhu.exe"), $backendExe, $frontendDist)) {
            if (-not (Test-Path $required)) { throw "download-back install missing: $required" }
          }

          python scripts/packaged_smoke.py --exe $backendExe --frontend-dist $frontendDist --resources $resources --report dist/release/download-back-smoke.json
          $smoke = Get-Content dist/release/download-back-smoke.json -Raw | ConvertFrom-Json
          if (-not $smoke.passed) { throw "download-back packaged smoke did not pass" }

          @{
            tag = $tag
            source = "GitHub Release download"
            source_sha = $sourceSha
            tag_sha = $tagSha
            installer_sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
            portable_sha256 = (Get-FileHash (Join-Path $download "Chengzhu-Portable-x64.zip") -Algorithm SHA256).Hash.ToLower()
            smoke_passed = $smoke.passed
          } | ConvertTo-Json -Depth 4 | Set-Content dist/release/download-back-verification.json -Encoding utf8

      - name: Upload download-back verification
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chengzhu-download-back-verification
          path: |
            dist/release/download-back-smoke.json
            dist/release/download-back-verification.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish verified GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$version" }
          $sourceSha = $env:CHENGZHU_RELEASE_SOURCE_SHA
          $tagSha = (gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $sourceSha) {
            throw "refusing to publish: tag $tag points to $tagSha but binaries were built from $sourceSha"
          }
          gh release edit $tag --draft=false --latest
          $isDraft = gh release view $tag --json isDraft --jq '.isDraft'
          if ($isDraft -ne 'false') { throw "verified release $tag did not publish" }
          Write-Host "published $tag from exact source $sourceSha"

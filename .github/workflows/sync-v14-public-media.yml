name: sync-v1.4-public-product-media

on:
  push:
    branches:
      - fix/v1.4-product-craft-closure
    paths:
      - .github/workflows/sync-v14-public-media.yml

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip media]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.4-product-craft-closure
          fetch-depth: 0

      - name: Download released v1.4.0 packaged runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/chengzhu-v14-media
          mkdir -p /tmp/chengzhu-v14-media
          gh run download 37316020206 \
            --repo "${{ github.repository }}" \
            --name chengzhu-runtime-ui-evidence \
            --dir /tmp/chengzhu-v14-media
          find /tmp/chengzhu-v14-media -maxdepth 4 -type f | sort | head -100

      - name: Promote current Goal-centered screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots

          copy_named() {
            src_name="$1"
            dst_name="$2"
            src="$(find /tmp/chengzhu-v14-media -type f -name "$src_name" | head -1)"
            if [ -z "$src" ]; then
              echo "missing runtime evidence: $src_name" >&2
              exit 1
            fi
            cp "$src" "docs/screenshots/$dst_name"
          }

          copy_named "02-action-home.png" "action-home.png"
          copy_named "04-goal-overview.png" "goal-room.png"
          copy_named "14-practice-setup.png" "practice.png"
          copy_named "21-preflight.png" "preflight.png"
          copy_named "23-live-fast-cue.png" "live-fast-cue.png"
          copy_named "16-reflection.png" "reflection.png"
          copy_named "20-command-palette.png" "command-palette.png"
          copy_named "29-mobile-390-goal-prepare.png" "goal-prepare-390.png"

          python - <<'PY'
          from pathlib import Path
          required = [
              "action-home.png", "goal-room.png", "practice.png", "preflight.png",
              "live-fast-cue.png", "reflection.png", "command-palette.png",
              "goal-prepare-390.png",
          ]
          root = Path("docs/screenshots")
          for name in required:
              p = root / name
              if not p.exists() or p.stat().st_size < 10_000:
                  raise SystemExit(f"invalid promoted screenshot: {p}")
          print("runtime screenshots promoted:", len(required))
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/sync-v14-public-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs(media): promote released v1.4 runtime UI [skip media]"
          git push origin HEAD:fix/v1.4-product-craft-closure

name: update-visual-snapshots

# Manually triggered workflow that regenerates Playwright screenshot
# baselines on the same Linux runner CI uses, then opens a PR with the
# new images. Use this when intentional UI changes break the
# visual-regression check on a feature PR.

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to base the snapshot PR on"
        required: false
        default: "main"
      runner_os:
        description: "Runner used for the platform-specific baseline (ubuntu-latest or macos-latest)"
        required: false
        default: "ubuntu-latest"

jobs:
  update:
    runs-on: ${{ github.event.inputs.runner_os || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          if [[ "${{ github.event.inputs.runner_os || 'ubuntu-latest' }}" == ubuntu-* ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Update snapshots
        working-directory: frontend
        run: npm run test:e2e:update-snapshots

      # Keep the generated baselines available even when repository policy
      # blocks Actions from opening pull requests. A maintainer can download
      # this artifact and commit the reviewed images from a normal checkout.
      - name: Upload generated snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-${{ github.event.inputs.runner_os || 'ubuntu-latest' }}-${{ github.run_number }}
          path: frontend/e2e/__screenshots__/**
          if-no-files-found: error
          retention-days: 14

      - name: Open PR with updated snapshots
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-visual-snapshots-${{ github.run_number }}
          base: ${{ github.event.inputs.base_branch }}
          commit-message: "chore(e2e): update Playwright visual snapshots"
          title: "chore(e2e): update visual regression snapshots"
          body: |
            Auto-generated by `update-visual-snapshots` workflow run #${{ github.run_number }}.

            Regenerated visual baselines from `${{ github.event.inputs.base_branch }}` on Ubuntu runner.

            Review the diff carefully:
            - If the UI changes are intentional, merge this PR.
            - If unexpected pixels changed, **do not merge** — investigate first.
          add-paths: |
            frontend/e2e/__screenshots__/**
          delete-branch: true
